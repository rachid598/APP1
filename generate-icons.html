<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Générateur d'icônes PWA</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
        }
        canvas {
            border: 1px solid #ccc;
            margin: 10px;
        }
        button {
            padding: 15px 30px;
            font-size: 16px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover {
            background: #5a5fd4;
        }
        .icons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }
        .icon-box {
            text-align: center;
        }
        a {
            display: block;
            margin-top: 10px;
            color: #667eea;
        }
    </style>
</head>
<body>
    <h1>Générateur d'icônes PWA</h1>
    <p>Cliquez sur les boutons pour télécharger les icônes PNG</p>

    <div class="icons">
        <div class="icon-box">
            <canvas id="canvas192" width="192" height="192"></canvas>
            <br>
            <button onclick="download(192)">Télécharger 192x192</button>
        </div>
        <div class="icon-box">
            <canvas id="canvas512" width="512" height="512"></canvas>
            <br>
            <button onclick="download(512)">Télécharger 512x512</button>
        </div>
    </div>

    <script>
        const sizes = [192, 512];

        function drawIcon(ctx, size) {
            const scale = size / 512;

            // Fond dégradé
            const gradient = ctx.createLinearGradient(0, 0, size, size);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(1, '#764ba2');

            // Fond arrondi
            const radius = 96 * scale;
            ctx.beginPath();
            ctx.roundRect(0, 0, size, size, radius);
            ctx.fillStyle = gradient;
            ctx.fill();

            // Cercle central blanc
            ctx.beginPath();
            ctx.arc(256 * scale, 240 * scale, 140 * scale, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255,255,255,0.95)';
            ctx.fill();

            // Plus (violet)
            ctx.fillStyle = '#667eea';
            ctx.fillRect(170 * scale, 155 * scale, 60 * scale, 14 * scale);
            ctx.fillRect(193 * scale, 132 * scale, 14 * scale, 60 * scale);

            // Moins (rose)
            ctx.fillStyle = '#f472b6';
            ctx.fillRect(282 * scale, 155 * scale, 60 * scale, 14 * scale);

            // Multiplier (vert)
            ctx.save();
            ctx.translate(200 * scale, 297 * scale);
            ctx.rotate(Math.PI / 4);
            ctx.fillStyle = '#22c55e';
            ctx.fillRect(-30 * scale, -7 * scale, 60 * scale, 14 * scale);
            ctx.rotate(-Math.PI / 2);
            ctx.fillRect(-30 * scale, -7 * scale, 60 * scale, 14 * scale);
            ctx.restore();

            // Diviser (orange)
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(282 * scale, 290 * scale, 60 * scale, 14 * scale);
            ctx.beginPath();
            ctx.arc(312 * scale, 272 * scale, 10 * scale, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(312 * scale, 322 * scale, 10 * scale, 0, Math.PI * 2);
            ctx.fill();

            // Texte "6e"
            ctx.fillStyle = '#764ba2';
            ctx.font = `bold ${72 * scale}px Arial`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('6', 240 * scale, 240 * scale);
            ctx.font = `bold ${36 * scale}px Arial`;
            ctx.fillText('e', 290 * scale, 220 * scale);

            // Badge étoile
            ctx.beginPath();
            ctx.arc(400 * scale, 400 * scale, 70 * scale, 0, Math.PI * 2);
            ctx.fillStyle = '#fbbf24';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(400 * scale, 400 * scale, 55 * scale, 0, Math.PI * 2);
            ctx.fillStyle = '#f59e0b';
            ctx.fill();

            // Étoile
            ctx.fillStyle = 'white';
            ctx.beginPath();
            const cx = 400 * scale, cy = 400 * scale;
            const outerR = 35 * scale, innerR = 15 * scale;
            for (let i = 0; i < 5; i++) {
                const outerAngle = (i * 72 - 90) * Math.PI / 180;
                const innerAngle = ((i * 72) + 36 - 90) * Math.PI / 180;
                if (i === 0) {
                    ctx.moveTo(cx + outerR * Math.cos(outerAngle), cy + outerR * Math.sin(outerAngle));
                } else {
                    ctx.lineTo(cx + outerR * Math.cos(outerAngle), cy + outerR * Math.sin(outerAngle));
                }
                ctx.lineTo(cx + innerR * Math.cos(innerAngle), cy + innerR * Math.sin(innerAngle));
            }
            ctx.closePath();
            ctx.fill();
        }

        // Dessiner les icônes
        sizes.forEach(size => {
            const canvas = document.getElementById('canvas' + size);
            const ctx = canvas.getContext('2d');
            drawIcon(ctx, size);
        });

        function download(size) {
            const canvas = document.getElementById('canvas' + size);
            const link = document.createElement('a');
            link.download = `icon-${size}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        }
    </script>
</body>
</html>
